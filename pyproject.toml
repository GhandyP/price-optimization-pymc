[project]
name = "price-optimization-pymc"
version = "1.0.0"
description = "Bayesian price optimization with PyMC and FastAPI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymc>=5.16,<6",
    "numpy>=1.26",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.6",
    "arviz",
]

[project.scripts]
price-opt = "price_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["price_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: runs the real PyMC sampler (slow)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
